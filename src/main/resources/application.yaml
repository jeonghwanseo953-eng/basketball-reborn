spring:
  application:
    name: reborn
  output:
    ansi:
      enabled: always
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:reborn;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

server:
  port: ${PORT:${SERVER_PORT:8081}}

app:
  bootstrap:
    web-admin-name: ${BOOTSTRAP_WEB_ADMIN_NAME:서정환}
  auth:
    require-write-auth: ${REQUIRE_WRITE_AUTH:false}
    dev-login-enabled: ${DEV_LOGIN_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
