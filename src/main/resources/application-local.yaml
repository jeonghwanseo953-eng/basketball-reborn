spring:
  datasource:
    url: jdbc:h2:file:./data/reborn-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  auth:
    dev-login-enabled: ${DEV_LOGIN_ENABLED:true}
