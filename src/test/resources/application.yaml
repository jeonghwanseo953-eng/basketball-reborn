spring:
  datasource:
    url: jdbc:h2:mem:reborn-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  output:
    ansi:
      enabled: always

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
