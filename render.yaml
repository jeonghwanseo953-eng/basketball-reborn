services:
  - type: web
    name: reborn
    env: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: reborn-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: reborn-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: reborn-db
          property: password
      - key: DATABASE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: JPA_DDL_AUTO
        value: update
      - key: REQUIRE_WRITE_AUTH
        value: true
      - key: DEV_LOGIN_ENABLED
        value: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false

databases:
  - name: reborn-db
    plan: free
