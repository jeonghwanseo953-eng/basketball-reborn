plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.seo'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.register('buildFrontend', Exec) {
	def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
	workingDir = file('frontend')
	commandLine isWindows ? ['npm.cmd', 'run', 'build'] : ['npm', 'run', 'build']
	inputs.files(fileTree('frontend/src'), 'frontend/index.html', 'frontend/package.json', 'frontend/package-lock.json', 'frontend/vite.config.ts', 'frontend/tsconfig.json', 'frontend/tsconfig.app.json', 'frontend/tailwind.config.js', 'frontend/postcss.config.js')
	outputs.dir('frontend/dist')
}

tasks.named('bootJar') {
	if (!project.hasProperty('skipFrontendBuild')) {
		dependsOn tasks.named('buildFrontend')
	}
	from('frontend/dist') {
		into 'BOOT-INF/classes/static'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
